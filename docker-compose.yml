# Safe to publish: this file contains no credentials.
#
# Secrets and personal values are read from .env (gitignored) — copy .env.example to .env
# and fill it in. Everything that is not secret is configured inline below, so .env stays
# short. Required values use ${VAR:?...}, which makes Compose fail with a clear message
# rather than starting a half-configured container.

services:
  listenbrainz-tidal-sync:
    # Published by .github/workflows/publish-image.yml on every push to main.
    # Pin to a release (:1.2.3) instead of :latest if you would rather update deliberately.
    # To build from source instead, uncomment `build: .` — it takes precedence over the pull.
    image: ghcr.io/gogo199432/tidalsyncer:latest
    # build: .
    container_name: listenbrainz-tidal-sync
    restart: unless-stopped

    # `daemon` syncs once on startup, then on SYNC_SCHEDULE.
    command: ["daemon"]

    ports:
      # Only used by the one-time `login`, which catches the OAuth redirect here.
      # Must match the port in TIDAL_REDIRECT_URI.
      - "8080:8080"
      # The daemon's status dashboard. It can start a sync, run a backup, and shows the
      # TIDAL device code while a login is pending — and it has no authentication. Publish
      # it only on a network you trust; "127.0.0.1:8081:8081" keeps it on this host.
      - "8081:8081"

    volumes:
      - sync-data:/data
      # Audio written by `download`. A bind mount rather than a named volume so the files
      # land somewhere your music server can already see; `export` does not need this.
      - ${LIBRARY_DIR:-./library}:/library

    environment:
      # ---- from .env -------------------------------------------------------
      LISTENBRAINZ_USER: ${LISTENBRAINZ_USER:?set LISTENBRAINZ_USER in .env}
      # Only needed when SYNC_FAVORITES is on; empty otherwise.
      LISTENBRAINZ_TOKEN: ${LISTENBRAINZ_TOKEN:-}
      TIDAL_CLIENT_ID: ${TIDAL_CLIENT_ID:?set TIDAL_CLIENT_ID in .env}
      TIDAL_CLIENT_SECRET: ${TIDAL_CLIENT_SECRET:?set TIDAL_CLIENT_SECRET in .env}

      # ISO 3166-1 alpha-2. Affects catalogue availability; set to your account's country.
      TIDAL_COUNTRY_CODE: ${TIDAL_COUNTRY_CODE:-US}

      # Used for the cron schedule below and for log timestamps.
      TZ: ${TZ:-UTC}

      # Sent in the User-Agent to ListenBrainz, as their API guidelines ask for.
      CONTACT_EMAIL: ${CONTACT_EMAIL:-listenbrainz-tidal-sync@localhost}

      # Drop tracks already in your TIDAL collection, per playlist family; "*" for all,
      # empty to disable. Enabling this adds the collection.read scope, so you must run
      # `login` once more afterwards.
      #
      # Weekly Jams is *designed* to be music you already know, so filtering it can empty
      # it out; weekly-exploration is usually the one worth filtering.
      TIDAL_SKIP_COLLECTION_FOR: ${TIDAL_SKIP_COLLECTION_FOR:-}

      # Downloading. Empty (the default) leaves `download` off; `export` is unaffected.
      # This is NOT the developer-portal client id above — see .env.example for why the
      # two cannot be the same, and what setting it means.
      TIDAL_DEVICE_CLIENT_ID: ${TIDAL_DEVICE_CLIENT_ID:-}
      TIDAL_DEVICE_CLIENT_SECRET: ${TIDAL_DEVICE_CLIENT_SECRET:-}

      # ---- inline configuration -------------------------------------------
      # Mirror your TIDAL collection back to ListenBrainz as loved recordings, after the
      # playlists are done. Needs LISTENBRAINZ_TOKEN in .env, and adds the collection.read
      # scope, so run `login` once more after switching it on.
      #
      # Additive only: un-favouriting on TIDAL never removes a ListenBrainz love.
      SYNC_FAVORITES: "true"
      # The playlists ListenBrainz keeps regenerating. This is also the built-in default.
      # Set to "*" to mirror every family instead, including the one-off year-in-review
      # lists (top-discoveries-of-2019, lb-radio, ...).
      LISTENBRAINZ_SOURCE_PATCHES: weekly-jams,weekly-exploration,daily-jams

      # Must be registered VERBATIM as a redirect URI on your app at developer.tidal.com,
      # and the port must match the `ports:` mapping above.
      TIDAL_REDIRECT_URI: http://localhost:8080/callback

      # PRIVATE (shows as "unlisted" in the TIDAL API) or PUBLIC.
      TIDAL_PLAYLIST_ACCESS: PRIVATE

      # {title} is the humanised family name, e.g. "Weekly Jams".
      TIDAL_PLAYLIST_NAME_TEMPLATE: "{title} (ListenBrainz)"

      # Credentials, sync state, the ISRC cache, and the `export` snapshot.
      # Backed by the sync-data volume.
      DATA_DIR: /data

      # Where `download` writes audio, matching the bind mount above.
      LIBRARY_DIR: /library

      # Tier `download` asks for first; it walks down when a track is not entitled.
      # hires | lossless | high | low
      TIDAL_DOWNLOAD_QUALITY: lossless

      # How closely a file already in LIBRARY_DIR must match before the track is skipped:
      #   exact           artist, album and title all agree
      #   album-agnostic  artist and title agree; the album may differ (default)
      #   loose           also ignores "(Remastered 2011)"-style suffixes
      # Extension is never part of the comparison, so an existing .mp3 counts as present.
      TIDAL_SKIP_TIER: album-agnostic

      # Pause between tracks. TIDAL answers a burst on the manifest endpoint with 429s and
      # eventually a captcha that deauthenticates the session — do not lower this casually.
      TIDAL_DOWNLOAD_DELAY_MS: "3000"

      # Cron expression for the daemon. Daily Jams refreshes daily, the weekly lists on
      # Mondays, so every 6 hours picks up a new edition promptly without being wasteful.
      SYNC_SCHEDULE: 0 */6 * * *

      # Status dashboard served by the daemon: sync stats, the next scheduled run, a button
      # that starts one now, and the whole backup path — device login, export and download,
      # with live progress. Set DASHBOARD_ENABLED to false to serve nothing at all.
      DASHBOARD_ENABLED: "true"
      DASHBOARD_PORT: 8081

      # debug | info | warn | error
      LOG_LEVEL: info

      # Resolve and report everything, but never write to TIDAL. Useful for a first run.
      DRY_RUN: "false"

volumes:
  # Pinned to a fixed name on purpose. Compose otherwise prefixes the volume with the
  # directory name, so moving or renaming this folder would silently hand the container a
  # brand-new empty volume — losing the stored TIDAL credentials and forcing a re-login.
  sync-data:
    name: listenbrainz-tidal-sync-data
