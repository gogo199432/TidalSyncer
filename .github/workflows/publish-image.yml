name: Publish container image

# Builds the image and pushes it to this repository's GitHub Container Registry
# package, so deployments can pull it instead of building from source.
#
#   main         -> :latest, :main, :edge, :sha-<commit>
#   v1.2.3 tag   -> :1.2.3, :1.2, :1, :latest
#
# Pull requests build but do not push, so a broken Dockerfile fails the PR.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # metadata-action lowercases this, which matters because the repo name is mixed case.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # main is the release channel, and the image is pinned by digest downstream — so an
  # untested push here is what a deployment ends up running. This gate exists because a
  # broken ffmpeg invocation once shipped that way and failed every track in production.
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ffmpeg is preinstalled on the GitHub runners; the demux test skips itself without
      # it, so assert it is really there rather than silently losing the coverage.
      - name: Check ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Test
        run: bun test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        # Skipped on pull requests: forks get a read-only token, and PRs do not push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=edge,enable={{is_default_branch}}
            # main is the release channel here, so it also moves :latest.
            # (A v* tag moves :latest too, via the semver rules above.)
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=listenbrainz-tidal-sync
            org.opencontainers.image.description=Mirrors ListenBrainz "Created for you" playlists into TIDAL playlists.

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs; bun install is the expensive step.
          cache-from: type=gha
          cache-to: type=gha,mode=max
